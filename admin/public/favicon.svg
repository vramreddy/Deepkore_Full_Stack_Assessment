<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="dkIconGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#248aff" />
      <stop offset="100%" stop-color="#00d26a" />
    </linearGradient>
    <linearGradient id="dkIconGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00d26a" />
      <stop offset="50%" stop-color="#248aff" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="dkIconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark pill background -->
  <rect width="48" height="48" rx="12" fill="#0A1128" />
  <rect width="48" height="48" rx="12" stroke="rgba(36, 138, 255, 0.2)" stroke-width="1.5" />

  <g transform="translate(2, 2)">
    <!-- Ambient glow -->
    <circle cx="22" cy="22" r="16" fill="url(#dkIconGrad1)" opacity="0.22" filter="url(#dkIconGlow)" />
    
    <!-- Outer swirl -->
    <path d="M 22 6 C 31 6, 38 13, 38 22 C 38 27, 35 31, 31 34 C 28 36, 24 38, 20 38 C 11 38, 6 31, 6 22" 
          stroke="url(#dkIconGrad1)" stroke-width="4.2" stroke-linecap="round" fill="none" />
    
    <!-- Inner swirl -->
    <path d="M 14 17 C 16 11, 24 10, 29 15 C 33 19, 31 26, 25 28 C 20 29, 16 26, 17 22" 
          stroke="url(#dkIconGrad2)" stroke-width="3.2" stroke-linecap="round" fill="none" />
    
    <!-- Nodes -->
    <circle cx="23" cy="21" r="3.2" fill="#00d26a" />
    <circle cx="32" cy="15" r="2" fill="#248aff" />
  </g>
</svg>

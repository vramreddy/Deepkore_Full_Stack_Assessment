<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" fill="none">
  <defs>
    <linearGradient id="dkGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#248aff" />
      <stop offset="100%" stop-color="#00d26a" />
    </linearGradient>
    <linearGradient id="dkGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00d26a" />
      <stop offset="50%" stop-color="#248aff" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="dkTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="dkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deepkore Emblem Icon -->
  <g transform="translate(6, 6)">
    <!-- Ambient back glow -->
    <circle cx="22" cy="22" r="18" fill="url(#dkGrad1)" opacity="0.18" filter="url(#dkGlow)" />
    
    <!-- Outer orbital ring segment 1 -->
    <path d="M 22 4 C 32 4, 40 12, 40 22 C 40 27, 37 32, 33 35 C 30 38, 25 40, 20 40 C 10 40, 4 32, 4 22" 
          stroke="url(#dkGrad1)" stroke-width="4.5" stroke-linecap="round" fill="none" />
    
    <!-- Inner dynamic swirl/core -->
    <path d="M 12 16 C 14 10, 24 8, 30 14 C 34 18, 32 26, 26 28 C 20 30, 16 26, 17 21" 
          stroke="url(#dkGrad2)" stroke-width="3.5" stroke-linecap="round" fill="none" />
    
    <!-- Central AI pulse node -->
    <circle cx="23" cy="21" r="3.5" fill="#00d26a" />
    <circle cx="33" cy="14" r="2.2" fill="#248aff" />
  </g>

  <!-- Wordmark 'deepkore' -->
  <text x="60" y="36" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="27" letter-spacing="-0.04em" fill="url(#dkTextGrad)">deep<tspan fill="#248aff">k</tspan><tspan fill="#00d26a">ore</tspan></text>
</svg>
